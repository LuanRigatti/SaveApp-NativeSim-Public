name: Swift Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  javascript-validation:
    name: Verify JavaScript, Expo, Jest, and native contracts
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run independent JavaScript and Expo gates
        shell: bash
        run: |
          set +e
          failed=0
          run_gate() {
            local name="$1"
            shift
            echo "::group::${name}"
            "$@"
            local status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::${name} failed with exit code ${status}"
              failed=1
            fi
          }

          run_gate 'Expo SDK compatibility' npx expo install --check
          run_gate 'Expo Doctor' npx expo-doctor
          run_gate 'TypeScript typecheck' npm run typecheck
          run_gate 'Lint' npm run lint
          run_gate 'Complete Jest suite' npm test -- --runInBand
          run_gate 'SaveApp native contracts' node scripts/verify-saveapp-native.js

          exit "$failed"

  ruby-xcodeproj-validation:
    name: Verify Ruby and real Xcodeproj integration
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v4

      - name: Run Ruby, Xcodeproj, and syntax diagnostics independently
        shell: bash
        run: |
          set +e
          failed=0
          run_gate() {
            local name="$1"
            shift
            echo "::group::${name}"
            "$@"
            local status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::${name} failed with exit code ${status}"
              failed=1
            fi
          }

          ruby --version
          run_gate 'Xcodeproj gem availability' ruby -rxcodeproj -e 'puts "Xcodeproj #{Xcodeproj::VERSION}"'
          run_gate 'Quick Save Ruby helper syntax' ruby -c modules/dynamic-island-quick-save/ios/expo_widgets_quick_save.rb
          run_gate 'Xcodeproj contract test syntax' ruby -c tests/quick-save-xcodeproj-contract.rb
          run_gate 'Real Xcodeproj fixture and generated project contract' ruby tests/quick-save-xcodeproj-contract.rb

          exit "$failed"

  swift-syntax-validation:
    name: Parse Quick Save and ExpoWidgets Swift sources
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install pinned sources and run independent Swift parse checks
        shell: bash
        run: |
          set +e
          failed=0
          npm ci
          install_status=$?
          if [ "$install_status" -ne 0 ]; then
            echo "::error::npm ci failed with exit code ${install_status}; local Swift sources will still be parsed"
            failed=1
          fi

          local_sources=(
            modules/dynamic-island-quick-save/ios/SaveAppQuickSaveLiveActivityButton.swift
            modules/dynamic-island-quick-save/ios/SaveAppQuickSaveIntent.swift
            modules/dynamic-island-quick-save/ios/SaveAppQuickSaveAppIntentsPackage.swift
            modules/dynamic-island-quick-save/ios/SaveAppQuickSaveSQLite.swift
          )

          for source in "${local_sources[@]}"; do
            echo "::group::Swift parse: ${source}"
            swiftc -frontend -parse "$source"
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::Swift parse failed for ${source} with exit code ${status}"
              failed=1
            fi
          done

          expo_widgets_renderer=node_modules/expo-widgets/ios/Widgets/Buttons.swift
          if [ "$install_status" -eq 0 ]; then
            echo "::group::Swift parse: ${expo_widgets_renderer}"
            swiftc -frontend -parse "$expo_widgets_renderer"
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::Swift parse failed for ${expo_widgets_renderer} with exit code ${status}"
              failed=1
            fi
          else
            echo "::notice::Skipped the installed ExpoWidgets renderer parse because npm ci did not provide node_modules"
          fi

          exit "$failed"

  native-integration-build:
    name: Generate, install Pods, and compile iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 120
    needs:
      - javascript-validation
      - ruby-xcodeproj-validation
      - swift-syntax-validation
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Report native toolchain
        run: |
          node --version
          npm --version
          xcodebuild -version
          ruby --version
          pod --version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate iOS project and install CocoaPods
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --no-install
          node scripts/verify-saveapp-quick-save-app-intents.js \
            ios/SaveApp.xcodeproj/project.pbxproj .
          npx pod-install ios

      - name: Verify Quick Save sources in the generated Pods project
        run: |
          set -euo pipefail
          ruby tests/quick-save-xcodeproj-contract.rb \
            --verify-generated ios/Pods/Pods.xcodeproj .

      - name: Verify generated ExpoWidgets Live Activity target and App Group
        run: |
          set -euo pipefail
          PROJECT=ios/SaveApp.xcodeproj/project.pbxproj
          APP_INFO=ios/SaveApp/Info.plist
          APP_ENTITLEMENTS=ios/SaveApp/SaveApp.entitlements
          WIDGET_INFO=ios/ExpoWidgetsTarget/Info.plist
          WIDGET_ENTITLEMENTS=ios/ExpoWidgetsTarget/ExpoWidgetsTarget.entitlements
          WIDGET_SOURCE=ios/ExpoWidgetsTarget/index.swift
          APP_GROUP=group.com.luanrigatti.saveapp

          test -f ios/SaveApp.xcworkspace/contents.xcworkspacedata
          grep -q 'StarterToolbarMorphExperimentVariant' ios/SaveApp/Info.plist
          grep -q 'ignoresSafeArea(.container, edges: .bottom)' node_modules/@expo/ui/ios/BottomSheetView.swift
          grep -q 'react-native-screens' package.json
          grep -q 'ExpoWidgetsTarget' "$PROJECT"
          grep -q 'com.apple.product-type.app-extension' "$PROJECT"
          grep -q 'ExpoWidgetsTarget.appex' "$PROJECT"
          grep -q 'WidgetLiveActivity()' "$WIDGET_SOURCE"

          for plist in "$APP_INFO" "$APP_ENTITLEMENTS" "$WIDGET_INFO" "$WIDGET_ENTITLEMENTS"; do
            test -f "$plist"
            plutil -lint "$plist"
          done

          assert_plist_value() {
            local plist="$1"
            local key_path="$2"
            local expected="$3"
            local actual
            actual=$(/usr/libexec/PlistBuddy -c "Print :$key_path" "$plist")
            test "$actual" = "$expected" || {
              echo "::error::Unexpected $key_path in $plist: $actual"
              exit 1
            }
          }

          assert_app_group_entitlement() {
            local plist="$1"
            /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$plist" \
              | grep -Fq "$APP_GROUP"
          }

          assert_plist_value "$APP_INFO" NSSupportsLiveActivities true
          assert_plist_value "$APP_INFO" NSSupportsLiveActivitiesFrequentUpdates false
          assert_plist_value "$APP_INFO" ExpoWidgetsAppGroupIdentifier "$APP_GROUP"
          assert_plist_value "$WIDGET_INFO" ExpoWidgetsAppGroupIdentifier "$APP_GROUP"
          assert_plist_value "$WIDGET_INFO" NSExtension:NSExtensionPointIdentifier com.apple.widgetkit-extension
          assert_app_group_entitlement "$APP_ENTITLEMENTS"
          assert_app_group_entitlement "$WIDGET_ENTITLEMENTS"

          # createLiveActivity uses the generated generic WidgetLiveActivity; widgets[] is not required.

      - name: Compile the Simulator app without signing
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/saveapp-swift-preflight-derived-data"
          xcodebuild \
            -workspace ios/SaveApp.xcworkspace \
            -scheme SaveApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet \
            build

      - name: Verify Simulator build embeds ExpoWidgets target
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/saveapp-swift-preflight-derived-data"
          APP="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/SaveApp.app"
          EXTENSION="$APP/PlugIns/ExpoWidgetsTarget.appex"
          test -d "$APP"
          test -d "$EXTENSION"
          assert_bundle_value() {
            local plist="$1"
            local key_path="$2"
            local expected="$3"
            local actual
            actual=$(/usr/libexec/PlistBuddy -c "Print :$key_path" "$plist")
            test "$actual" = "$expected" || {
              echo "::error::Unexpected $key_path in $plist: $actual"
              exit 1
            }
          }
          assert_bundle_value "$APP/Info.plist" CFBundleIdentifier com.luanrigatti.saveapp
          assert_bundle_value "$EXTENSION/Info.plist" CFBundleIdentifier com.luanrigatti.saveapp.ExpoWidgetsTarget
          assert_bundle_value "$EXTENSION/Info.plist" NSExtension:NSExtensionPointIdentifier com.apple.widgetkit-extension
